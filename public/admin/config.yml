publish_mode: editorial_workflow

backend:
  name: github
  repo: connecttechnologyteam/devnotes
  branch: duc-develop
  base_url: https://devnotes-oauth-provider.vercel.app
  auth_endpoint: /api/auth
  callback_url: https://devnotes-oauth-provider.vercel.app/api/callback
  site_url: https://connecttechnologyteam.github.io/devnotes

collections:
  - name: blog # 👈 this "name" is used in the URL below
    label: Blog
    folder: content/user
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Body, name: body, widget: markdown }
