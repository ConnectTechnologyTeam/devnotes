backend:
  name: github
  repo: ConnectTechnologyTeam/devnotes
  branch: main
  base_url: https://devnotes-oauth-provider.vercel.app
  auth_endpoint: /api/auth

site_url: https://connecttechnologyteam.github.io/devnotes

media_folder: "public/uploads"
public_folder: "/devnotes/uploads"

publish_mode: editorial_workflow
cms_label_prefix: "decap-cms/"

collections:
  - name: "users"
    label: "Users"
    folder: "content/users"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { name: github, label: "GitHub Login", widget: "string" }
      - { name: name, label: "Full Name", widget: "string", required: false }
      - { name: avatar, label: "Avatar", widget: "image", required: false }
      - { name: bio, label: "Bio", widget: "text", required: false }
      - {
          name: role,
          label: "Role",
          widget: "select",
          options: ["admin", "author"],
          default: "author",
        }

  - name: "posts"
    label: "Posts"
    folder: "content/pages"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "articles/{{slug}}"
    fields:
      - { name: title, label: "Title", widget: "string" }
      - { name: date, label: "Date", widget: "datetime" }
      - {
          name: author,
          label: "Author",
          widget: "relation",
          collection: "users",
          value_field: "{{slug}}",
          search_fields: ["name", "github"],
          display_fields: ["name", "github"],
        }
      - { name: description, label: "Summary", widget: "text", required: false }
      - {
          name: categories,
          label: "Categories",
          widget: "select",
          multiple: true,
          options: ["Java", "Spring", "Microservices", "Architecture"],
        }
      - { name: tags, label: "Tags", widget: "list", required: false }
      - { name: draft, label: "Draft", widget: "boolean", default: false }
      - { name: body, label: "Body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Title", widget: "string" }
      - {
          name: description,
          label: "Description",
          widget: "text",
          required: false,
        }
      - { name: body, label: "Body", widget: "markdown" }
      - { name: draft, label: "Draft", widget: "boolean", default: false }
