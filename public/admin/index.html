<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- DecapCMS script (must be included) -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- Optional helper: surface your stashed draft -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const raw = localStorage.getItem("draft:article");
        if (!raw) return;
        try {
          console.log(
            "Found a stashed draft from the app. Paste into fields:",
            JSON.parse(raw)
          );
        } catch (e) {
          console.warn("Failed to parse stashed draft:", e);
        }
      });
    </script>
  </body>
</html>
