<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- DecapCMS script -->
    <script>
      // Surface a reminder in CMS to use the stashed draft
      document.addEventListener("DOMContentLoaded", () => {
        const raw = localStorage.getItem("draft:article");
        if (!raw) return;
        console.log(
          "Found a stashed draft from the app. Paste into fields:",
          JSON.parse(raw)
        );
      });
    </script>
  </body>
</html>
